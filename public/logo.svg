<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="sqBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a2926"/>
      <stop offset="50%" stop-color="#1e1d1b"/>
      <stop offset="100%" stop-color="#141312"/>
    </linearGradient>
    <linearGradient id="emeraldKnight" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#95c85c"/>
      <stop offset="35%" stop-color="#81b64c"/>
      <stop offset="100%" stop-color="#446824"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="18" y1="14" x2="40" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f3d179"/>
      <stop offset="100%" stop-color="#e5b84b"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#81b64c" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Dark Squircle Bezel with Specular Edge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#sqBg)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.2"/>
  <rect x="3" y="3" width="58" height="58" rx="15" stroke="rgba(0, 0, 0, 0.6)" stroke-width="1"/>

  <!-- Pedestal / Base -->
  <path d="M14 50 C14 48 16 47 18 47 L46 47 C48 47 50 48 50 50 L50 52 C50 53.1 49.1 54 48 54 L16 54 C14.9 54 14 53.1 14 52 Z" fill="url(#emeraldKnight)"/>
  <path d="M18 45 L46 45 C47.1 45 48 45.9 48 47 L16 47 C16 45.9 16.9 45 18 45 Z" fill="url(#goldAccent)" opacity="0.9"/>

  <!-- Geometric Modern Knight Silhouette -->
  <path d="M20 45 C20 40 21.5 35 24 31 C25.8 28 26.5 24.5 25 20.5 C24 18 25.5 13 31 10 C33.5 8.7 37 9.5 38.5 12 C39.5 14 39 16.5 37 18 C41 17.5 45 19.5 46.5 23.5 C47.8 27.5 46 31 44 33 C46.5 35 48 38.5 47.5 42.5 C47.2 44.5 45.5 45 44 45 Z" fill="url(#emeraldKnight)" filter="url(#subtleGlow)"/>

  <!-- Brushed Gold Mane & Crest Accents -->
  <path d="M29 18 C30.5 14 33.5 11.5 36 11 C34.5 13.5 34.5 16 32 18 C30.8 18.8 30 19 29 18 Z" fill="url(#goldAccent)"/>
  <path d="M26 25 C27.5 22 30 20 32 19.5 C31 21.5 30.5 23.5 28.5 25 Z" fill="url(#goldAccent)" opacity="0.85"/>

  <!-- Knight Eye Specular Point -->
  <circle cx="39" cy="22" r="2.2" fill="#141312"/>
  <circle cx="39" cy="22" r="1.4" fill="url(#goldAccent)"/>
  <circle cx="39.4" cy="21.6" r="0.5" fill="#ffffff"/>

  <!-- Muzzle Jaw Line -->
  <path d="M45 29 C42.5 30.5 39 30.5 36.5 29" stroke="url(#goldAccent)" stroke-width="1.8" stroke-linecap="round"/>
</svg>
