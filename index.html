<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d1c1a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f5f0" media="(prefers-color-scheme: light)" />
    <title>Chess | Ismail Studio</title>
    <meta name="description" content="Play real-time chess with friends, challenge bots at every level, and track your rating." />

    <!-- Pre-paint Theme Resolver (Zero Theme Flash) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var pref = saved || 'system';
          var resolved = pref;
          if (pref === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts: Plus Jakarta Sans (headings), Inter (body & tabular numerals) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- OpenGraph (WhatsApp, Telegram, Discord, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chess | Ismail Studio" />
    <meta property="og:title" content="Chess | Ismail Studio" />
    <meta property="og:description" content="Play real-time chess with friends, challenge bots at every level, and track your rating." />
    <meta property="og:image" content="https://chess.ismailstudio.my/og-preview.png?v=2" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Chess by Ismail Studio - Play chess. Get better." />
    <meta property="og:url" content="https://chess.ismailstudio.my" />

    <!-- Twitter Summary Large Image -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chess | Ismail Studio" />
    <meta name="twitter:description" content="Play real-time chess with friends, challenge bots at every level, and track your rating." />
    <meta name="twitter:image" content="https://chess.ismailstudio.my/og-preview.png?v=2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
